[workspace]
members = ["crates/e8-core", "crates/e8", "crates/e8-script", "crates/e8-gui", "crates/e8-mcp", "crates/e8-agent", "crates/e8-web"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.5.7"
license = "GPL-3.0-or-later"

# Dependencies are optimised even in debug builds, so tests that run egui,
# QuickJS and tree-sitter run near release speed, while E8's own crates
# still build quickly and debug well.
[profile.dev.package."*"]
opt-level = 2
