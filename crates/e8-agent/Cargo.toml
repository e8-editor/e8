[package]
name = "e8-agent"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["v8"]
# The script engine, as e8-script's features choose it.
quickjs = ["e8-script/quickjs", "e8-mcp/quickjs"]
v8 = ["e8-script/v8", "e8-mcp/v8"]

[dependencies]
e8-core = { version = "0.5.0", path = "../e8-core" }
e8-script = { version = "0.5.0", path = "../e8-script", default-features = false }
e8-mcp = { version = "0.5.0", path = "../e8-mcp", default-features = false }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3.27.0"
