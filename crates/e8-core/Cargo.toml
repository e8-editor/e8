[package]
name = "e8-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
# The file system in memory that the web build uses, natively, for tests (vfs.rs).
memory-fs = []

[dev-dependencies]
tempfile = "3.27.0"

[dependencies]
regex = "1"
memchr = "2"
ropey = { version = "1.6", default-features = false, features = ["simd"] }
tree-sitter = "0.27"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-language = "0.1"
unicode-width = "0.2"
encoding_rs = "0.8"
# The clock: std's natively, the browser's on the web, where std's panics.
web-time = "1"
# Decoding PNG, JPEG and GIF images shown by display specs (ADR 0046).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
# Reading and drawing SVG images (ADR 0046).
resvg = { version = "0.49", default-features = false, features = ["svgz"] }
# Decompressing gzip and zlib data, as Emacs's zlib-decompress-region (ADR 0075); resvg already brings it.
flate2 = "1"
# Hashes for secure-hash and md5, as fns.c gives them; sha1 and sha2 already in the tree.
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"

# Neither has a web build: the browser has no shared libraries or trash.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Loading grammars built as shared libraries, as Emacs's treesit-language-available-p finds them (ADR 0056).
libloading = "0.8"
# Moving deleted files to the system's trash, as Finder or a desktop's file manager does.
trash = "5"
# TLS for network processes, as Emacs's gnutls.c gives it (ADR 0075): rustls
# on ring, as the agent's ureq already builds it, verifying against the
# system's certificates and any trust files given, and x509-parser to
# describe a peer's certificates as gnutls-peer-status does.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
ring = "0.17"
rustls-pki-types = { version = "1", features = ["std"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
x509-parser = "0.18"

[target.'cfg(unix)'.dependencies]
# Owner and group names for file listings.
libc = "0.2"

