[package]
name = "e8-gui"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["v8"]
# The script engine, as e8-script's features choose it.
quickjs = ["e8-script/quickjs", "e8-agent/quickjs", "e8-mcp/quickjs"]
v8 = ["e8-script/v8", "e8-agent/v8", "e8-mcp/v8"]

[dependencies]
eframe = "0.37"
egui = "0.37"
e8-core = { version = "0.5.3", path = "../e8-core" }
e8-script = { version = "0.5.3", path = "../e8-script", default-features = false }
fontique = "0.11"
# Each font's underline position and thickness, which egui does not give;
# egui reads its fonts with it already.
skrifa = { version = "0.44", default-features = false, features = ["std"] }

# The system clipboard, the agent and E8 as an MCP server, none of which a
# browser has.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3.7"
e8-agent = { version = "0.5.3", path = "../e8-agent", default-features = false }
e8-mcp = { version = "0.5.3", path = "../e8-mcp", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSGraphics"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }
tempfile = "3.27.0"
