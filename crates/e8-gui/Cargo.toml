[package]
name = "e8-gui"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["v8", "xwidgets"]
# The script engine, as e8-script's features choose it.
quickjs = ["e8-script/quickjs", "e8-agent/quickjs", "e8-mcp/quickjs"]
v8 = ["e8-script/v8", "e8-agent/v8", "e8-mcp/v8"]
# Web views shown in buffers, as Emacs's xwidgets (ADR 0089): WKWebView on
# macOS and WebKitGTK on Linux, through wry. Without it the GUI shows an
# xwidget's text, as a terminal does, and needs no WebKit to build.
xwidgets = ["dep:wry", "dep:gtk"]

[dependencies]
eframe = "0.37"
egui = "0.37"
e8-core = { version = "0.5.19", path = "../e8-core" }
e8-script = { version = "0.5.19", path = "../e8-script", default-features = false }
fontique = "0.11"
# Scripts' results from web views, which wry gives as JSON (ADR 0089).
serde_json = "1"
# Each font's underline position and thickness, which egui does not give;
# egui reads its fonts with it already.
skrifa = { version = "0.44", default-features = false, features = ["std"] }

# The system clipboard, the agent and E8 as an MCP server, none of which a
# browser has.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3.7"
e8-agent = { version = "0.5.19", path = "../e8-agent", default-features = false }
e8-mcp = { version = "0.5.19", path = "../e8-mcp", default-features = false }

# Native web views for xwidgets (ADR 0089), pinned: 0.57.2 is too new.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
wry = { version = "=0.57.1", optional = true }

# GTK, which wry's WebKitGTK views need started and its loop run.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSGraphics", "NSApplication", "NSResponder", "NSColorPanel", "NSPanel", "NSWindow"] }
objc2 = "0.6"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }
tempfile = "3.27.0"
