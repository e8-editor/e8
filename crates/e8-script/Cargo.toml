[package]
name = "e8-script"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
e8-core = { version = "0.5.8", path = "../e8-core" }
rquickjs = { version = "0.14", features = ["loader"], optional = true }
v8 = { version = "152.2", optional = true }
swc_common = "26"
swc_ecma_ast = "29"
swc_ecma_parser = "46"
swc_ecma_visit = "29"
swc_ts_fast_strip = "59"

[features]
default = ["v8"]
# The script engine: V8 (the v8 crate) or QuickJS (rquickjs), exactly one (ADR 0054).
quickjs = ["dep:rquickjs"]
v8 = ["dep:v8"]
# Files in memory, as on the web, for tests (e8-core's vfs.rs).
memory-fs = ["e8-core/memory-fs"]

[build-dependencies]
swc_common = "26"
swc_ecma_ast = "29"
swc_ecma_parser = "46"
swc_ecma_visit = "29"
swc_ts_fast_strip = "59"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tempfile = "3.27.0"
# A TLS server, and its certificates, for the TLS tests.
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
