# Runs what `make check` runs, every test and clippy on V8 and on QuickJS,
# and the tests of the ports in their own repositories against this E8,
# so a change here that breaks one shows here
# (docs/adr/0059-packages-are-git-repositories.md).
#
# On main after each merge, and by hand (Actions, Test, Run workflow), not on
# pull requests: while E8 changes fast, `make check` before pushing is
# the gate, and waiting 20 minutes on GitHub's runners to merge is not worth
# it. Turn pull requests back on once a stage branch takes the merges
# (CLAUDE.md, "Branches, worktrees and pull requests").
#
# V8 on macOS, where E8 is made and used, and both engines on Linux,
# which the releases are built for too. One job on macOS, not two: GitHub's
# Apple silicon runners are often short, and a job that gets none for 15
# minutes is cancelled. A change to the docs alone runs nothing.

name: Test

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.engine }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: v8, os: macos-15 }
          - { engine: v8, os: ubuntu-24.04 }
          - { engine: quickjs, os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    env:
      FEATURES: ${{ matrix.engine == 'quickjs' && '--no-default-features --features quickjs' || '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust and cargo-nextest
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          case "$RUNNER_OS" in macOS) platform=mac ;; *) platform=linux ;; esac
          # macOS runners have no ~/.cargo/bin until something makes it.
          bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p "$bin"
          echo "$bin" >> "$GITHUB_PATH"
          curl -LsSf "https://get.nexte.st/latest/$platform" | tar zxf - -C "$bin"
          PATH="$bin:$PATH" cargo nextest --version

      # What Emacs's answers were recorded with: Ispell for flyspell's
      # oracle cases, and GNU's coreutils first on PATH, as on the Mac they
      # were recorded on, for the cases that run commands such as wc, whose
      # output macOS's own pad differently.
      - name: Install Ispell and GNU coreutils
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ispell coreutils
            echo "$(brew --prefix)/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"
          else
            # Homebrew's Ispell, whose dictionary is the one the answers were
            # recorded with; Ubuntu's suggests other words.
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ispell
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
            export PATH="$(brew --prefix)/bin:$PATH"
          fi
          ispell -v | head -1

      # Tests make git repositories and commits of their own.
      - name: Set up git
        run: |
          git config --global user.name "E8 CI"
          git config --global user.email "ci@e8.invalid"
          git config --global init.defaultBranch main

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: test-${{ matrix.os }}-${{ matrix.engine }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-${{ matrix.os }}-${{ matrix.engine }}-

      - name: Test
        run: cargo nextest run --workspace --locked $FEATURES

      - name: Clippy
        run: cargo clippy --all-targets --locked $FEATURES

  ports:
    name: Ports
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ports-${{ hashFiles('Cargo.lock') }}
          restore-keys: ports-

      - name: Build e8
        run: cargo build --locked -p e8

      # The ports moved to repositories of their own, each tested with its
      # own `make test` against the e8 just built.
      - name: Test the ports
        run: |
          e8="$PWD/target/debug/e8"
          failed=""
          for port in e8-vundo e8-themes e8-persistent-scratch e8-popper e8-casual \
            e8-vertico e8-orderless e8-marginalia e8-consult e8-magit-section \
            e8-with-editor e8-magit e8-org-roam e8-consult-org-roam; do
            echo "::group::$port"
            git clone --quiet --depth 1 "https://github.com/e8-editor/$port" "$RUNNER_TEMP/$port"
            if ! make -C "$RUNNER_TEMP/$port" test E8="$e8"; then
              failed="$failed $port"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Ports whose tests failed against this E8:$failed"
            exit 1
          fi
