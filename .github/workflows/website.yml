# Builds E8 for the web and publishes the website, with E8 running in it,
# to GitHub Pages at https://e8-editor.github.io/e8/ (docs/adr/0066-e8-in-a-browser.md).
#
# Runs after a merge to main that changes the website or the web build, and
# by hand (workflow_dispatch), as after a release, so the page shows the
# packages as released. Pages must be set to deploy from GitHub Actions:
# Settings, Pages, Source.
#
# GitHub Pages cannot send the headers that make a page cross-origin
# isolated, which E8's shared memory needs; website/sw.js adds them.

name: Website

on:
  push:
    branches: [main]
    paths: ["website/**", "crates/e8-web/**", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: true

env:
  # The nightly std is rebuilt from, with atomics; pinned so a new nightly
  # cannot break the site's build unannounced.
  WASM_TOOLCHAIN: nightly-2026-11-08
  WASM_BINDGEN: 0.2.129

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install "$WASM_TOOLCHAIN" --profile minimal --component rust-src --target wasm32-unknown-unknown

      # Linux's clang targets wasm, for QuickJS and tree-sitter. The runner's
      # image has clang-18 and llvm-ar-18, which build.sh takes from WASM_CC
      # and WASM_AR; apt only when it does not, as Ubuntu's mirror cannot
      # always be reached (on 2026-11-11 for over an hour).
      - name: Find clang
        run: |
          if command -v clang-18 >/dev/null && command -v llvm-ar-18 >/dev/null; then
            echo "WASM_CC=clang-18" >> "$GITHUB_ENV"
            echo "WASM_AR=llvm-ar-18" >> "$GITHUB_ENV"
            clang-18 --version | head -1
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends clang llvm
          fi

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/wasm-bindgen
            target/wasm
          key: website-${{ env.WASM_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: website-${{ env.WASM_TOOLCHAIN }}-

      - name: Install wasm-bindgen
        run: |
          if [ "$(wasm-bindgen --version 2>/dev/null)" != "wasm-bindgen $WASM_BINDGEN" ]; then
            cargo install wasm-bindgen-cli --version "$WASM_BINDGEN" --locked --bin wasm-bindgen --force
          fi

      - name: Build E8 for the web
        run: STRIP=1 crates/e8-web/build.sh

      - name: Put the website together
        run: website/assemble.sh _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
